name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (also downloads Playwright's Chromium)
        run: npm ci

      - name: Install Playwright system dependencies
        run: npx playwright install --with-deps chromium

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (unit + real end-to-end renders)
        run: npm test

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image on native AMD64
        run: docker build -t lottie-render:ci .
      - name: Render in a 512 MiB container without network or swap
        run: |
          docker run --rm --init --network none --cpus 1 --memory 512m --memory-swap 512m \
            lottie-render:ci sh -c '
              node dist/cli.js doctor &&
              node dist/cli.js render public/sample.json -o /tmp/sample.mp4 --fps 15 &&
              test "$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 /tmp/sample.mp4)" = 45
            '
